<div class="container">
    <h2>API Data</h2>
    
    <div *ngIf="loading" class="loading">
      Loading...
    </div>
  
    <div *ngIf="error" class="error">
      {{ error }}
    </div>
  
    <div *ngIf="!loading && !error" class="data-container">
      <div *ngFor="let item of data" class="data-item">
        <pre>{{ item | json }}</pre>
      </div>
    </div>
  </div>
